<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EduMind</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Zain:ital,wght@0,200;0,300;0,400;0,700;0,800;0,900;1,300;1,400&display=swap"
        rel="stylesheet">
    <style>
        /* global */
        *,
        *::after,
        *::before {
            margin: 0%;
            padding: 0%;
            box-sizing: border-box;
            border: none;
            outline: none;
            background-color: transparent;
        }

        body {
            font-family: "Zain", sans-serif;
        }

        /* mobile container */
        .mobile-design {
            background-color: #fff;
            width: 100%;
            max-width: 600px;
            height: 100vh;
            margin: auto;
            position: relative;
            overflow: hidden;
        }

        /* intro */

        .mobile-design .intro {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* bg */
        .mobile-design .intro .bg {
            background-image: url(images/bg.png);
            background-size: cover;
            background-position: bottom;
            position: absolute;
            top: 0%;
            left: 0%;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0;
            transition: .5s;
        }

        .mobile-design .intro .bg::after {
            content: " ";
            position: absolute;
            top: 0%;
            left: 0%;
            width: 100%;
            height: 100%;
            background-color: #da9825e3;
        }

        /* animated */

        .mobile-design .intro .bg.animated {
            opacity: 1;
        }

        /* logo */

        .mobile-design .intro .float-logo {
            width: 55%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
            transition: .5s;

        }

        .mobile-design .intro .float-logo .l-Icon {
            width: 30%;
            transform: scale(100) translateY(40%);
            transition: 1.4s;
        }

        .mobile-design .intro .float-logo .l-TextCon {
            overflow: hidden;
            height: 0;
            transition: .8s;
        }

        .mobile-design .intro .float-logo .l-TextCon .l-Text {
            transform: translateY(-100%);
            transform-origin: bottom;
            transition: .8s;
            width: 100%;
        }

        /* animated */

        .mobile-design .intro .float-logo.animated {
            filter: brightness(0) saturate(100%) invert(100%) drop-shadow(0 1px 3px rgba(0, 0, 0, 0.18));
            transform: translate(-50%, -130%);
        }


        .mobile-design .intro .float-logo .l-Icon.animated {
            transform: scale(1) translateY(0%);
        }

        .mobile-design .intro .float-logo .l-TextCon.animated {
            height: 65px;
        }

        .mobile-design .intro .float-logo .l-TextCon .l-Text.animated {
            transform: translateY(0%);
        }

        /* intro-content */
        .mobile-design .intro .intro-content {
            position: absolute;
            left: 0%;
            bottom: 10%;
            width: 100%;
            z-index: 3;
            direction: rtl;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            padding: 10%;
            text-shadow: 0 0px 3px #0000002e;
            transition: .4s;
        }

        /* animated out */

        .mobile-design .intro .intro-content.animated-out {
            opacity: 0;
            transform: translateY(50%);
        }

        .mobile-design .intro .intro-content .head-text {
            color: #fff;
            font-size: 24px;
            opacity: 0;
            transform: translateY(100%);
            transition: .5s;
        }

        .mobile-design .intro .intro-content .head-text span {
            font-weight: 900;
            font-size: 40px;
            display: block;
        }

        .mobile-design .intro .intro-content .description-text {
            color: #fff;
            font-size: 14px;
            opacity: 0;
            transform: translateY(100%);
            transition-duration: .5s;
            transition-delay: .3s;
        }

        .mobile-design .intro .intro-content .intro-btn {
            background-color: #252b35;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1%;
            color: #fff;
            font-family: inherit;
            border-radius: 100px;
            margin-top: 30px;
            height: 45px;
            font-weight: bold;
            opacity: 0;
            transform: translateY(100%);
            transition-duration: .5s;
            transition-delay: .6s;
        }

        .mobile-design .intro .intro-content .intro-btn:hover {
            background-color: #363e4d;
        }

        .mobile-design .intro .intro-content .intro-btn .btn-icon {
            aspect-ratio: 1/1;
            display: block;
            height: 100%;
            background-color: #da9825;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mobile-design .intro .intro-content .intro-btn:hover .btn-icon {
            background-color: #eea629;
        }

        .mobile-design .intro .intro-content .intro-btn .btn-icon svg {
            width: 45%;
        }

        .mobile-design .intro .intro-content .intro-btn .freespan {
            height: 100%;
            aspect-ratio: 1/1;
        }

        /* animated */

        .mobile-design .intro .intro-content .head-text.animated,
        .mobile-design .intro .intro-content .description-text.animated,
        .mobile-design .intro .intro-content .intro-btn.animated {
            opacity: 1;
            transform: translateY(0%);
        }

        /* forms-box */

        .forms-box {
            position: absolute;
            bottom: 0%;
            left: 0%;
            width: 100%;
            padding: 20px;
            padding-bottom: 20%;
            z-index: 4;
            direction: rtl;
            opacity: 0;
            transform: translateY(100%);
            transition-duration: .4s;
            transition-delay: .3s;
        }

        /* animated */

        .forms-box.animated {
            opacity: 1;
            transform: translateY(0%);
        }

        .forms-box .child {
            position: relative;
            /* background-color: #ffffff; */
            /* border-radius: 24px; */
            /* padding: 16px; */
            /* border: 1px solid #ffffff;
            box-shadow:
                0 16px 40px rgba(180, 140, 50, 0.08),
                0 3px 12px rgba(0, 0, 0, 0.02); */
        }

        .forms-box .child .form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .forms-box .child .form .head-title {
            text-align: center;
        }

        .forms-box .child .form .head-title .title {
            font-size: 18px;
            font-weight: 700;
            color: #181424;
            color: #fff;
            letter-spacing: -0.025em;
        }

        .forms-box .child .form .head-title .sub-title {
            font-size: 11.5px;
            color: #8C867B;
            color: #fff;
            font-weight: 400;
            margin-top: 2px;
        }

        .forms-box .child .form form {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* الحاوية الأساسية */
        .phone-field-wrapper {
            position: relative;
            width: 100%;
        }

        /* صندوق الإدخال التفاعلي */
        .input-box {
            position: relative;
            display: flex;
            align-items: center;
            background-color: rgba(250, 248, 245, 0.9);
            border-radius: 16px;
            padding: 10px 14px;
            /* py-2.5 px-3.5 */
            border: 1px solid #ECE5D8;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.015);
            transition: all 300ms cubic-bezier(0, 0, 0.2, 1);
            /* duration-300 ease-out */
            box-sizing: border-box;
        }

        .input-box:hover {
            background-color: #F5F1E8;
            border-color: #DECDBA;
        }

        .input-box:focus-within {
            background-color: #ffffff;
            border-color: #eea629;
            box-shadow:
                0 0 0 4px rgba(238, 166, 41, 0.12),
                0 4px 18px rgba(238, 166, 41, 0.12);
        }

        /* زر كود الدولة داخل الحقل */
        .btn-code {
            font-weight: 700;
            font-size: 13.5px;
            color: #7A7264;
            background: none;
            border: none;
            cursor: pointer;
            user-select: none;
            flex-shrink: 0;
            padding: 0;
            transition: color 0.15s ease;
        }

        .btn-code:hover {
            color: #181424;
        }

        /* حقل رقم الهاتف */
        .input-phone {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            padding: 0 10px;
            /* px-2.5 */
            font-size: 13.5px;
            font-weight: 500;
            color: #181424;
            text-align: right;
        }

        .input-phone::placeholder {
            color: #ADA598;
        }

        .input-phone::selection {
            background-color: rgba(238, 166, 41, 0.25);
        }

        /* أيقونة الهاتف */
        .phone-icon {
            width: 15px;
            height: 15px;
            color: #A39B8E;
            flex-shrink: 0;
            margin-right: 4px;
            margin-left: 4px;
            transition: all 300ms ease;
        }

        /* محاكاة كلاس group-focus-within في Tailwind */
        .input-box:focus-within .phone-icon {
            color: #eea629;
            transform: scale(1.05);
        }

        /* القائمة المنسدلة */
        .country-menu {
            display: none;
            /* يتم إظهارها وإخفاؤها بالـ jQuery */
            position: absolute;
            top: 100%;
            margin-top: 6px;
            /* mt-1.5 */
            left: 0;
            right: 0;
            z-index: 40;
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            border: 1px solid #ECE5D8;
            max-height: 192px;
            /* max-h-48 */
            overflow-y: auto;
            padding: 6px;
            /* p-1.5 */
            box-sizing: border-box;
        }

        /* أزرار عناصر القائمة */
        .country-option {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 10px;
            /* py-1.5 px-2.5 */
            border-radius: 12px;
            font-size: 11.5px;
            font-weight: 500;
            color: #334155;
            /* text-slate-700 */
            background: transparent;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .country-option:hover {
            background-color: #F9F6F0;
        }

        /* العنصر النشط / المختار */
        .country-option.selected {
            background-color: rgba(254, 243, 199, 0.9);
            /* bg-amber-50/90 */
            color: #b8770c;
            font-weight: 700;
            border-color: rgba(253, 230, 138, 0.5);
            /* border-amber-200/50 */
        }

        .country-label {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .country-label .flag {
            font-size: 14px;
        }

        .country-option .code {
            color: #64748b;
            /* text-slate-500 */
        }

        .country-option.selected .code {
            color: #b8770c;
        }

        /* remember */

        /* الحاوية الأساسية */
        .options-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 2px;
            /* pt-0.5 */
            width: 100%;
            box-sizing: border-box;
        }

        /* تسمية صندوق الاختيار */
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            /* gap-1.5 */
            cursor: pointer;
            user-select: none;
        }

        /* زر الاختيار */
        .custom-checkbox {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #dcd7ce;
            background-color: #ffffff;
            padding: 0;
            cursor: pointer;
            outline: none;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            /* shadow-xs */
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        /* الحالة النشطة (Checked) */
        .custom-checkbox.checked {
            background-color: #171424;
            border-color: #171424;
        }

        /* أيقونة علامة الصح */
        .check-icon {
            width: 11px;
            height: 11px;
            color: #ffffff;
            display: block;
        }

        /* إخفاء الأيقونة عند إلغاء التحديد */
        .custom-checkbox:not(.checked) .check-icon {
            display: none;
        }

        /* نص الخيار */
        .label-text {
            font-size: 11.5px;
            font-weight: 500;
            color: #4C463D;
            color: #fff;
        }

        .submit-btn {
            width: 100%;
            height: 46px;
            background-color: #171424;
            color: #ffffff;
            border: none;
            border-radius: 9999px;
            /* rounded-full */
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6px;
            /* px-1.5 */
            box-shadow: 0 4px 6px -1px rgba(28, 25, 23, 0.15), 0 2px 4px -2px rgba(28, 25, 23, 0.15);
            /* shadow-stone-900/15 */
            cursor: pointer;
            margin-top: 8px;
            /* mt-2 */
            transition: all 0.2s ease;
            box-sizing: border-box;
            font-family: inherit;
        }

        /* حالة Hover و Active */
        .submit-btn:hover {
            background-color: #252038;
        }

        .submit-btn:active {
            transform: scale(0.985);
            /* active:scale-[0.985] */
        }

        /* النص الداخلي */
        .btn-text {
            font-size: 13.5px;
            font-weight: 600;
            flex: 1;
            text-align: center;
            padding-right: 24px;
            /* pr-6 لموازنة وجود الدائرة على اليسار وتوسيط النص تماماً */
        }

        /* دائرة الأيقونة */
        .icon-circle {
            width: 30px;
            /* w-7.5 تعادل 1.875rem = 30px */
            height: 30px;
            /* h-7.5 */
            border-radius: 9999px;
            background-color: #ffffff;
            color: #171424;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            /* shadow-xs */
            transition: transform 0.2s ease;
        }

        /* تأثير تكبير الدائرة عند الـ Hover على الزر (group-hover) */
        .submit-btn:hover .icon-circle {
            transform: scale(1.05);
        }

        /* الأيقونة نفسها */
        .arrow-icon {
            width: 15px;
            height: 15px;
        }

        /* الحاوية الأساسية للفاصل */
        .divider-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            /* gap-3 تعادل 0.75rem */
            margin-top: 12px;
            /* my-3 */
            margin-bottom: 12px;
            user-select: none;
            /* select-none */
            width: 100%;
            box-sizing: border-box;
        }

        /* الخصائص المشتركة لخطوط الفاصل */
        .divider-line {
            flex: 1;
            /* flex-1 */
            height: 1px;
            /* h-[1px] */
        }

        /* تدرج الخط الأيمن (من الشفافية إلى اللون) */
        .divider-right {
            background: linear-gradient(to right, transparent, #E5DFD4, #E5DFD4);
        }

        /* تدرج الخط الأيسر (من الشفافية إلى اللون بالاتجاه العكسي) */
        .divider-left {
            background: linear-gradient(to left, transparent, #E5DFD4, #E5DFD4);
        }

        /* تنسيق كلمة "أو" في المنتصف */
        .divider-text {
            font-size: 12px;
            /* text-[12px] */
            font-weight: 500;
            /* font-medium */
            color: #fff;
            /* text-[#948C7F] */
            line-height: 1;
            /* leading-none */
            padding-left: 4px;
            /* px-1 */
            padding-right: 4px;
            letter-spacing: normal;
            /* tracking-normal */
            flex-shrink: 0;
        }

        .signup-prompt {
            text-align: center;
            /* text-center */
            font-size: 12px;
            /* text-[12px] */
            color: #fff;
            /* text-[#7A7468] */
        }

        .btn-signup {
            background: none;
            border: none;
            padding: 0;
            margin: 0;
            font-family: inherit;
            font-size: inherit;
            font-weight: 700;
            /* font-bold */
            color: #171525;
            /* text-[#eea629] */
            cursor: pointer;
            /* cursor-pointer */
            text-decoration: none;
            transition: color 0.15s ease;
        }

        .btn-signup:hover {
            color: #0e0d17;
            /* hover:text-[#c9830c] */
            text-decoration: underline;
            /* hover:underline */
        }
    </style>
</head>

<body>


    <div class="mobile-design">
        <div class="intro">
            <div class="bg"></div>
            <div class="float-logo">
                <img class="l-Icon" src="images/icon.png">
                <div class="l-TextCon">
                    <img class="l-Text" src="images/logo-en-text.png">
                </div>
            </div>
            <!-- content -->
            <div class="intro-content">
                <p class="head-text">
                    بوابتك الذكية نحو
                    <span>تعلّم أفضل!</span>
                </p>
                <p class="description-text">
                    تابع رحلة أبنائك التعليمية، واكتشف تقدّمهم، وساعدهم على التعلّم بشكل أفضل كل يوم.
                </p>

                <button class="intro-btn">
                    <span class="btn-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-play preview-icon">
                            <path
                                d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z" />
                        </svg>
                    </span>
                    <span>ابدأ الان</span>
                    <span class="freespan"></span>
                </button>
            </div>
            <!-- forms box -->

            <div class="forms-box">
                <div class="child">
                    <div class="login-box">
                        <div class="form">
                            <div class="head-title">
                                <p class="title">
                                    أهلاً بك مجدداً!
                                </p>
                                <p class="sub-title">
                                    سجل دخول و دعنا نتابع احدث المستجدات
                                </p>
                            </div>
                            <form>
                                <div class="phone-field-wrapper">
                                    <!-- حقل الإدخال الرئيسي -->
                                    <div class="input-box group">
                                        <button type="button" class="btn-code" id="btn-country-code" dir="ltr"
                                            title="انقر لتغيير كود الدولة">
                                            +20
                                        </button>

                                        <input type="tel" class="input-phone" placeholder="010 1234 5678" dir="ltr"
                                            required value="" />

                                        <svg class="phone-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                                            fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
                                            stroke-linejoin="round" aria-hidden="true">
                                            <path
                                                d="M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384">
                                            </path>
                                        </svg>
                                    </div>

                                    <!-- القائمة المنسدلة لاختيار الدولة -->
                                    <div class="country-menu" id="country-menu">
                                        <button type="button" class="country-option selected" data-code="+20">
                                            <div class="country-label">
                                                <span class="flag">🇪🇬</span>
                                                <span>مصر</span>
                                            </div>
                                            <span class="code" dir="ltr">+20</span>
                                        </button>

                                        <button type="button" class="country-option" data-code="+966">
                                            <div class="country-label">
                                                <span class="flag">🇸🇦</span>
                                                <span>السعودية</span>
                                            </div>
                                            <span class="code" dir="ltr">+966</span>
                                        </button>

                                        <button type="button" class="country-option" data-code="+971">
                                            <div class="country-label">
                                                <span class="flag">🇦🇪</span>
                                                <span>الإمارات</span>
                                            </div>
                                            <span class="code" dir="ltr">+971</span>
                                        </button>

                                        <button type="button" class="country-option" data-code="+965">
                                            <div class="country-label">
                                                <span class="flag">🇰🇼</span>
                                                <span>الكويت</span>
                                            </div>
                                            <span class="code" dir="ltr">+965</span>
                                        </button>

                                        <button type="button" class="country-option" data-code="+974">
                                            <div class="country-label">
                                                <span class="flag">🇶🇦</span>
                                                <span>قطر</span>
                                            </div>
                                            <span class="code" dir="ltr">+974</span>
                                        </button>

                                        <button type="button" class="country-option" data-code="+962">
                                            <div class="country-label">
                                                <span class="flag">🇯🇴</span>
                                                <span>الأردن</span>
                                            </div>
                                            <span class="code" dir="ltr">+962</span>
                                        </button>

                                        <button type="button" class="country-option" data-code="+1">
                                            <div class="country-label">
                                                <span class="flag">🇺🇸</span>
                                                <span>أمريكا</span>
                                            </div>
                                            <span class="code" dir="ltr">+1</span>
                                        </button>
                                    </div>
                                </div>

                                <div class="options-row" dir="rtl">
                                    <!-- خيار تذكر هذا الجهاز -->
                                    <label class="checkbox-label">
                                        <button type="button" role="checkbox" aria-checked="true"
                                            class="custom-checkbox checked" id="remember-checkbox">
                                            <svg class="check-icon" xmlns="http://www.w3.org/2000/svg"

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js"></script>
    <script>
        $(window).ready(function () {
            // animated
            $(".mobile-design .intro .float-logo .l-Icon").addClass("animated");

            setTimeout(function () {
                $(".mobile-design .intro .float-logo .l-TextCon").addClass("animated");
                $(".mobile-design .intro .float-logo .l-TextCon .l-Text").addClass("animated");
            }, 1600)

            setTimeout(function () {
                $(".mobile-design .intro .bg").addClass("animated");
                $(".mobile-design .intro .float-logo").addClass("animated");
            }, 3000)

            setTimeout(function () {
                $(".mobile-design .intro .intro-content .head-text").addClass("animated");
                $(".mobile-design .intro .intro-content .description-text").addClass("animated");
                $(".mobile-design .intro .intro-content .intro-btn").addClass("animated");
            }, 4000)

            // out

            $(".intro-btn").click(function () {
                $(".mobile-design .intro .intro-content").addClass("animated-out")
                $(".forms-box").addClass("animated")
            })

            // phone field

            const $menu = $('#country-menu');
            const $btnCode = $('#btn-country-code');
            const $wrapper = $('.phone-field-wrapper');

            // فتح وإغلاق القائمة المنسدلة
            $btnCode.on('click', function (e) {
                e.stopPropagation();
                $menu.stop(true, true).fadeToggle(150);
            });

            // تحديد الدولة وتحديث الكود
            $menu.on('click', '.country-option', function () {
                const code = $(this).data('code');

                $btnCode.text(code);

                $('.country-option').removeClass('selected');
                $(this).addClass('selected');

                $menu.fadeOut(150);
                $('.input-phone').focus();
            });

            // إغلاق عند النقر في أي مساحة خارجية
            $(document).on('click', function (e) {
                if (!$(e.target).closest($wrapper).length) {
                    $menu.fadeOut(150);
                }
            });

        })


    </script>
</body>

</html>
